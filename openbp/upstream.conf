# Upstream that OpenBP Docs tracks. Sourced by the scripts in openbp/scripts.

# Read-only GitHub mirror of Collabora Online (development happens on Gerrit).
UPSTREAM_URL=https://github.com/CollaboraOnline/online.mirror.git

# Release tags we follow: cp-<major>.<minor>.<patch>-<build>, e.g. cp-26.04.4-2.
# Anything else (cp-*-HEAD, coda-*, helm-*, libreoffice-*) is ignored.
UPSTREAM_TAG_REGEX='^cp-[0-9]+\.[0-9]+\.[0-9]+-[0-9]+$'

# Official image the runtime (office engine + coolwsd) is taken from. Its tag is
# derived from the upstream tag: cp-26.04.4-2 -> 26.04.4.2.1
BASE_IMAGE=docker.io/collabora/code
