# Build the OpenBP Docs image, smoke-test it and publish it to GHCR.
#
# Runs on every push to main, manually, and from sync-upstream.yml after a new
# upstream release was merged (pushes made with GITHUB_TOKEN do not trigger
# `push` workflows, so the sync calls this one directly). Images are pushed
# only for runs on main; other branches are built and smoke-tested.
name: Build image

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Commit to build
        type: string
        required: true

permissions:
  contents: read
  packages: write

concurrency:
  group: build-image
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Resolve versions
        id: v
        run: |
          tag=$(sed -n 's/^tag=//p' .upstream-version)
          version=$(openbp/scripts/upstream-tags.sh version "$tag")
          base=$(openbp/scripts/upstream-tags.sh base-image "$tag")
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/openbp-docs"
          {
            echo "tag=$tag"
            echo "version=$version"
            echo "base=$base"
            echo "image=$image"
            echo "sha=$(git rev-parse HEAD)"
            echo "short_sha=$(git rev-parse --short=10 HEAD)"
          } >> "$GITHUB_OUTPUT"
          echo "Upstream $tag -> $image:$version (runtime from $base)" >> "$GITHUB_STEP_SUMMARY"

      - name: Check that the official runtime image exists
        run: |
          docker buildx imagetools inspect "${{ steps.v.outputs.base }}" > /dev/null || {
            echo "::error::Official image ${{ steps.v.outputs.base }} is not published (yet). Re-run this workflow once it is."
            exit 1
          }

      - name: Fetch build assets (engine slice, npm tarballs)
        run: openbp/scripts/fetch-build-assets.sh

      - uses: docker/setup-buildx-action@v3

      - name: Build (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: openbp/docker/Dockerfile
          build-args: BASE_IMAGE=${{ steps.v.outputs.base }}
          platforms: linux/amd64
          load: true
          tags: |
            ${{ steps.v.outputs.image }}:${{ steps.v.outputs.version }}
            ${{ steps.v.outputs.image }}:latest
            ${{ steps.v.outputs.image }}:sha-${{ steps.v.outputs.short_sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.v.outputs.sha }}
            org.opencontainers.image.version=${{ steps.v.outputs.version }}
            org.opencontainers.image.base.name=${{ steps.v.outputs.base }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: openbp/test/smoke.sh "${{ steps.v.outputs.image }}:${{ steps.v.outputs.version }}"

      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Push exactly the image that passed the smoke test.
      - name: Push
        if: github.ref == 'refs/heads/main'
        run: |
          docker push --all-tags "${{ steps.v.outputs.image }}"
          echo "Published \`${{ steps.v.outputs.image }}:${{ steps.v.outputs.version }}\` (also \`latest\`, \`sha-${{ steps.v.outputs.short_sha }}\`)" >> "$GITHUB_STEP_SUMMARY"
